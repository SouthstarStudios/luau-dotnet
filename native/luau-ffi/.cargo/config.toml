# San Aurie fork: Android 15+ devices with 16 KB pages (and Google Play) need 16 KB-aligned ELF segments; NDK r27 still
# links with 4 KB alignment by default
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
